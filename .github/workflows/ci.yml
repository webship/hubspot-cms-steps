name: CI

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Build the demo site with DDEV
        run: ddev start

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (no undefined or ambiguous steps)
        run: npx cucumber-js --dry-run

      - name: Run webship-js tests against the DDEV site
        run: |
          LAUNCH_URL="$(ddev describe -j | jq -r '.raw.primary_url')"
          LAUNCH_URL="$LAUNCH_URL" npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            tests/reports/
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
